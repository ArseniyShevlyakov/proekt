<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виды и способы тестирования</title>
  <link rel="stylesheet" href="/index.css"> 
</head>
<body>
  <!-- Фиксированная чёрная полоса с меню -->
  <div class="top-bar" id="top-bar"></div>

  <!-- Контейнер для основного контента -->
  <div id="root"></div>

  <!-- Подключаем React и Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React-компонент меню -->
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const DropdownMenu = () => {
      const [isOpen, setIsOpen] = useState(false);
      const dropdownRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };

        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <div className="hamburger-container">
          <div className="dropdown" ref={dropdownRef}>
            <button 
              className={`dropdown-btn ${isOpen ? 'open' : ''}`} 
              onClick={() => setIsOpen(!isOpen)}
              aria-label="Меню"
            >
              <div className="hamburger">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </button>
            
            <div className={`dropdown-content ${isOpen ? 'show' : ''}`}>
              <a href="#" onClick={(e) => { e.preventDefault(); window.dispatchEvent(new CustomEvent('sectionChange', { detail: 'home' })); setIsOpen(false); }}>
                Главная страница
              </a>
              <a href="#" onClick={(e) => { e.preventDefault(); window.dispatchEvent(new CustomEvent('sectionChange', { detail: 'about' })); setIsOpen(false); }}>
                О компании
              </a>
              <a href="#" onClick={(e) => { e.preventDefault(); window.dispatchEvent(new CustomEvent('sectionChange', { detail: 'services' })); setIsOpen(false); }}>
                Наши услуги
              </a>
              <a href="#" onClick={(e) => { e.preventDefault(); window.dispatchEvent(new CustomEvent('sectionChange', { detail: 'portfolio' })); setIsOpen(false); }}>
                Портфолио
              </a>
              <a href="#" onClick={(e) => { e.preventDefault(); window.dispatchEvent(new CustomEvent('sectionChange', { detail: 'team' })); setIsOpen(false); }}>
                Наша команда
              </a>
              <a href="#" onClick={(e) => { e.preventDefault(); window.dispatchEvent(new CustomEvent('sectionChange', { detail: 'pricing' })); setIsOpen(false); }}>
                Цены
              </a>
              <a href="#" onClick={(e) => { e.preventDefault(); window.dispatchEvent(new CustomEvent('sectionChange', { detail: 'contacts' })); setIsOpen(false); }}>
                Контакты
              </a>
            </div>
          </div>
        </div>
      );
    };

    // Рендерим только меню в top-bar
    const topBarRoot = ReactDOM.createRoot(document.getElementById('top-bar'));
    topBarRoot.render(<DropdownMenu />);
  </script>

  <!-- React-компонент основного контента -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const sectionOrder = ['home', 'about', 'services', 'portfolio', 'team', 'pricing', 'contacts'];
      const [activeSection, setActiveSection] = useState('home');

      useEffect(() => {
        const handleSectionChange = (e) => {
          setActiveSection(e.detail);
        };

        window.addEventListener('sectionChange', handleSectionChange);
        return () => window.removeEventListener('sectionChange', handleSectionChange);
      }, []);

      const goToNextSection = () => {
        const currentIndex = sectionOrder.indexOf(activeSection);
        if (currentIndex < sectionOrder.length - 1) {
          setActiveSection(sectionOrder[currentIndex + 1]);
        }
      };

      const goToPrevSection = () => {
        const currentIndex = sectionOrder.indexOf(activeSection);
        if (currentIndex > 0) {
          setActiveSection(sectionOrder[currentIndex - 1]);
        }
      };

      // Содержимое разделов
      const sections = {
        home: {
          title: "Главная",
          content: (
            <> <h2>Методическое пособие по тестированию ПО</h2>
              <p>Современная разработка программного обеспечения предъявляет высокие требования к качеству и надежности продуктов.
                 Тестирование играет ключевую роль в этом процессе, позволяя выявлять дефекты, снижать риски и обеспечивать
                 соответствие программного обеспечения ожиданиям пользователей. Данное методическое пособие призвано систематизировать
                 знания о тестировании, предоставить практические рекомендации и помочь специалистам эффективно организовывать процесс
                 проверки качества ПО.<br/><br/> Цель данного пособия – дать читателям структурированное представление о принципах, методах 
                 и инструментах тестирования, а также сформировать навыки их практического применения.</p>
              <h3>Основные задачи:</h3>
              <ul>
                <li>Рассмотреть ключевые концепции и виды тестирования.</li>
                <li>Описать процесс тестирования от планирования до отчетности.</li>
                <li>Познакомить с современными инструментами и подходами к автоматизации.</li>
                <li>Дать рекомендации по эффективному поиску и документированию дефектов.</li>
                <li>Предоставить практические примеры и лучшие практики.</li>
              </ul>
              <h3>Пособие предназначено для:</h3>
              <ul>
                <li>Начинающих тестировщиков (QA), желающих освоить основы профессии.</li>
                <li>Разработчиков, которые хотят углубить понимание процессов тестирования.</li>
                <li>Руководителей проектов и аналитиков, отвечающих за качество ПО.</li>
                <li>Студентов IT-специальностей, изучающих обеспечение качества программного обеспечения.</li>
              </ul>
              <br/>
              <div className="section-navigation">
                <button className="nav-button" disabled>&lt;</button>
                <button className="nav-button" onClick={goToNextSection}>&gt;</button>
              </div>
            </>
          )
        },
        about: {
          title: "О компании",
          content: (
            <>
              <h2>О нашей компании</h2>
              <p>Основанная в 2015 году, наша студия выросла из маленькой команды в полноценное агентство.</p>
              
              <div className="section-navigation">
                <button className="nav-button" onClick={goToPrevSection}>&lt;</button>
                <button className="nav-button" onClick={goToNextSection}>&gt;</button>
              </div>
            </>
          )
        },
        services: {
          title: "Услуги",
          content: (
            <>
              <h2>Наши услуги</h2>
              <div className="grid-container">
                <div className="card">
                  <h3>Веб-разработка</h3>
                  <p>Создание сайтов любой сложности</p>
                </div>
                <div className="card">
                  <h3>Мобильные приложения</h3>
                  <p>iOS и Android разработка</p>
                </div>
                <div className="card">
                  <h3>UI/UX дизайн</h3>
                  <p>Создание удобных интерфейсов</p>
                </div>
              </div>
              
              <div className="section-navigation">
                <button className="nav-button" onClick={goToPrevSection}>&lt;</button>
                <button className="nav-button" onClick={goToNextSection}>&gt;</button>
              </div>
            </>
          )
        },
        portfolio: {
          title: "Портфолио",
          content: (
            <>
              <h2>Наши работы</h2>
              <div className="grid-container">
                <div className="card">
                  <h3>Корпоративный сайт</h3>
                  <p>Современный дизайн, система управления контентом</p>
                </div>
                <div className="card">
                  <h3>Мобильное приложение</h3>
                  <p>iOS и Android версии с синхронизацией данных</p>
                </div>
              </div>
              
              <div className="section-navigation">
                <button className="nav-button" onClick={goToPrevSection}>&lt;</button>
                <button className="nav-button" onClick={goToNextSection}>&gt;</button>
              </div>
            </>
          )
        },
        team: {
          title: "Команда",
          content: (
            <>
              <h2>Наша команда</h2>
              <p>В нашей студии работают профессионалы с опытом от 5 лет.</p>
              
              <div className="section-navigation">
                <button className="nav-button" onClick={goToPrevSection}>&lt;</button>
                <button className="nav-button" onClick={goToNextSection}>&gt;</button>
              </div>
            </>
          )
        },
        pricing: {
          title: "Цены",
          content: (
            <>
              <h2>Наши тарифы</h2>
              <div className="grid-container">
                <div className="card">
                  <h3>Старт</h3>
                  <p>от 50 000 ₽</p>
                </div>
                <div className="card">
                  <h3>Бизнес</h3>
                  <p>от 150 000 ₽</p>
                </div>
                <div className="card">
                  <h3>Премиум</h3>
                  <p>от 300 000 ₽</p>
                </div>
              </div>
              
              <div className="section-navigation">
                <button className="nav-button" onClick={goToPrevSection}>&lt;</button>
                <button className="nav-button" onClick={goToNextSection}>&gt;</button>
              </div>
            </>
          )
        },
        contacts: {
          title: "Контакты",
          content: (
            <>
              <h2>Как нас найти</h2>
              <p><strong>Адрес:</strong> г. Москва, ул. Примерная, д. 10</p>
              <p><strong>Телефон:</strong> +7 (495) 123-45-67</p>
              <p><strong>Email:</strong> info@example.com</p>
              
              <div className="section-navigation">
                <button className="nav-button" onClick={goToPrevSection}>&lt;</button>
                <button className="nav-button" disabled>&gt;</button>
              </div>
            </>
          )
        }
      };

      return (
        <div className="content">
          {Object.entries(sections).map(([key, section]) => (
            <div key={key} className={`content-section ${activeSection === key ? 'active' : ''}`}>
              {section.content}
            </div>
          ))}
        </div>
      );
    };

    // Рендерим основное приложение
    const appRoot = ReactDOM.createRoot(document.getElementById('root'));
    appRoot.render(<App />);
  </script>
</body>
</html>
